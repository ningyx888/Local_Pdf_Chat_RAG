[project]
name = "local-pdf-chat-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.104.1",
    "gradio>=6.0.0,<7.0.0",
    "jieba>=0.42.1",
    "langchain-text-splitters>=1.1.3",
    "markdown>=3.4.3",
    "numpy>=1.26.1",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pdfminer-six>=20221105",
    "psutil>=5.9.0",
    "pydantic>=2.9.2,<2.11.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "requests>=2.31.0",
    "sentence-transformers>=2.2.2",
    "urllib3>=1.26.16",
    "uvicorn>=0.23.2",
    "xlrd>=2.0.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
